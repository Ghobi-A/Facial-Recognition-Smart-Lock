[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeauth-lab"
version = "0.1.0"
description = "Local facial verification, presentation attack detection, and edge ML evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "cryptography>=44,<52",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<14",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.53,<2", "altair>=5,<7"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
study = ["matplotlib>=3.8,<4", "scipy>=1.11,<2"]
legacy = ["face_recognition>=1.3,<2", "dlib>=19.24", "setuptools<81"]
tracking = ["mlflow>=2.10,<4"]

[project.scripts]
edgeauth = "edgeauth.cli:main"
edgeauth-study = "edgeauth.study.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
